name: 🐛 Bug Report / 问题反馈
description: Report a bug or unexpected behavior in LanChat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description / 问题描述
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open LanChat on Machine A (IP: 192.168.1.10)
        2. Open LanChat on Machine B (IP: 192.168.1.20)
        3. Send a message / transfer a file...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 预期行为
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System / 操作系统
      options:
        - Windows 11 / 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LanChat Version / 软件版本
      placeholder: e.g. v2.0.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional Context or Logs / 日志或截图
      description: Paste any logs, stack traces, or attach screenshots.
